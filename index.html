<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academia Impulso Digital — En mantenimiento</title>
  <meta name="description" content="Estamos realizando algunos ajustes y nuestro sitio web no está disponible temporalmente." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Decoración de fondo (SVG, puramente decorativa) -->
  <svg class="bg-decor" viewBox="0 0 1440 1100" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">

    <!-- Esquina superior izquierda: arcos concéntricos -->
    <g class="decor-arcs-tl" fill="none" stroke="#1E5FBF">
      <circle cx="10" cy="95" r="110" stroke-width="2" opacity="0.18" />
      <circle cx="10" cy="95" r="180" stroke-width="10" opacity="0.16" />
      <circle cx="10" cy="95" r="250" stroke-width="2" opacity="0.16" />
      <circle cx="10" cy="95" r="325" stroke-width="1.5" stroke-dasharray="2 10" opacity="0.3" />
      <circle cx="18" cy="378" r="5" fill="#1E5FBF" opacity="0.3" />
      <circle cx="82" cy="396" r="7" stroke-width="2" opacity="0.25" />
      <circle cx="412" cy="104" r="4" fill="#1E5FBF" opacity="0.25" />
    </g>

    <!-- Esquina superior derecha: patrón de circuito -->
    <g class="decor-circuit" fill="none" stroke="#1E5FBF" stroke-width="2" opacity="0.28">
      <path d="M1170 190 L1170 115 L1235 115 L1235 60 L1300 60" />
      <path d="M1355 10 L1355 72 L1415 72 L1415 145" />
      <g class="decor-circuit-nodes" stroke="none" fill="#1E5FBF">
        <rect x="1163" y="108" width="14" height="14" transform="rotate(45 1170 115)" />
        <rect x="1228" y="53" width="14" height="14" transform="rotate(45 1235 60)" />
        <circle cx="1300" cy="60" r="5" />
        <rect x="1348" y="65" width="14" height="14" transform="rotate(45 1355 72)" />
        <circle cx="1415" cy="145" r="5" />
      </g>
      <circle class="decor-mobile-hide" cx="1400" cy="308" r="9" opacity="0.9" />
    </g>

    <!-- Cuadrícula tenue de puntos, esquina superior derecha -->
    <g class="decor-dot-grid decor-mobile-hide" fill="#1E5FBF" opacity="0.2">
      <circle cx="920" cy="18" r="2.5" /><circle cx="950" cy="18" r="2.5" /><circle cx="980" cy="18" r="2.5" /><circle cx="1010" cy="18" r="2.5" />
      <circle cx="920" cy="45" r="2.5" /><circle cx="950" cy="45" r="2.5" /><circle cx="980" cy="45" r="2.5" /><circle cx="1010" cy="45" r="2.5" />
      <circle cx="920" cy="72" r="2.5" /><circle cx="950" cy="72" r="2.5" /><circle cx="980" cy="72" r="2.5" /><circle cx="1010" cy="72" r="2.5" />
    </g>

    <!-- Puntos sueltos, esparcidos -->
    <g class="decor-dots" fill="#1E5FBF">
      <circle cx="1390" cy="600" r="8" fill="none" stroke="#1E5FBF" stroke-width="2" opacity="0.22" />
      <circle class="decor-mobile-hide" cx="1065" cy="940" r="6" opacity="0.25" />
      <circle cx="1050" cy="1030" r="4" opacity="0.3" />
      <circle cx="30" cy="780" r="5" opacity="0.25" />
      <circle class="decor-mobile-hide" cx="60" cy="850" r="7" fill="none" stroke="#1E5FBF" stroke-width="2" opacity="0.2" />
    </g>

    <!-- Cuadrícula tenue de puntos, esquina inferior izquierda -->
    <g class="decor-dot-grid decor-mobile-hide" fill="#1E5FBF" opacity="0.14">
      <circle cx="170" cy="1015" r="2" /><circle cx="200" cy="1015" r="2" /><circle cx="230" cy="1015" r="2" />
      <circle cx="170" cy="1045" r="2" /><circle cx="200" cy="1045" r="2" /><circle cx="230" cy="1045" r="2" />
      <circle cx="170" cy="1075" r="2" /><circle cx="200" cy="1075" r="2" /><circle cx="230" cy="1075" r="2" />
    </g>

    <!-- Esquina inferior derecha: cintas de flujo -->
    <g class="decor-ribbons" fill="none" stroke-linecap="round">
      <path d="M980 1100 C1080 1000, 1150 900, 1220 800 C1280 720, 1350 680, 1440 660" stroke="#BFD6F5" stroke-width="70" opacity="0.22" />
      <path class="decor-mobile-hide" d="M1040 1100 C1130 990, 1200 890, 1270 790 C1320 720, 1380 690, 1440 700" stroke="#1E5FBF" stroke-width="34" opacity="0.3" />
    </g>

  </svg>

  <main class="page">
    <div class="card">

      <!-- Ícono oficial (búho) de Academia Impulso Digital -->
      <img
        class="logo"
        src="logo-academia.png"
        alt=""
      />

      <!-- Wordmark oficial "Academia Impulso Digital" -->
      <img
        class="wordmark"
        src="wordmark-academia.png"
        alt="Academia Impulso Digital"
      />

      <h1 class="title">Estamos en mantenimiento</h1>
      <p class="subtitle">Estamos realizando algunos ajustes y nuestro sitio web no está disponible temporalmente</p>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
