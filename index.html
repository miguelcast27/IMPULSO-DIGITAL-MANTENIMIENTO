<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academia Impulso Digital — En mantenimiento</title>
  <meta name="description" content="Estamos realizando algunos ajustes y nuestro sitio web no está disponible temporalmente." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <div class="card">

      <!-- Búho animado -->
      <div class="owl-wrap" role="img" aria-label="Búho de Academia Impulso Digital con casco de mantenimiento, saludando">
        <svg class="owl" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">

          <!-- Ala izquierda (detrás del cuerpo) -->
          <g class="owl-wing-left">
            <ellipse cx="72" cy="132" rx="20" ry="34" fill="#1E5FBF" />
          </g>

          <!-- Cuerpo -->
          <g class="owl-body">
            <ellipse cx="110" cy="125" rx="58" ry="62" fill="#FFFFFF" stroke="#0B1F4D" stroke-width="5" />

            <!-- Panza -->
            <ellipse cx="110" cy="140" rx="34" ry="38" fill="#EAF1FB" stroke="#0B1F4D" stroke-width="2.5" />

            <!-- Cabeza / orejas -->
            <path d="M78 70 L88 44 L100 68 Z" fill="#0B1F4D" />
            <path d="M142 70 L132 44 L120 68 Z" fill="#0B1F4D" />

            <!-- Ojos -->
            <g class="owl-eyes">
              <circle cx="90" cy="102" r="17" fill="#FFFFFF" stroke="#0B1F4D" stroke-width="4" />
              <circle cx="130" cy="102" r="17" fill="#FFFFFF" stroke="#0B1F4D" stroke-width="4" />
              <circle class="owl-pupil" cx="90" cy="103" r="7" fill="#0B1F4D" />
              <circle class="owl-pupil" cx="130" cy="103" r="7" fill="#0B1F4D" />
              <!-- Párpado para el guiño (ojo derecho) -->
              <path class="owl-eyelid" d="M113 102 a17 17 0 0 1 34 0 z" fill="#0B1F4D" />
            </g>

            <!-- Pico -->
            <path d="M104 116 L116 116 L110 130 Z" fill="#F5A623" />
          </g>

          <!-- Ala derecha (saluda) -->
          <g class="owl-wing-right">
            <ellipse cx="150" cy="130" rx="20" ry="34" fill="#1E5FBF" />
          </g>

          <!-- Patas -->
          <g class="owl-feet">
            <path d="M96 182 v10 M96 192 l-6 6 M96 192 l6 6" stroke="#F5A623" stroke-width="4" stroke-linecap="round" fill="none" />
            <path d="M124 182 v10 M124 192 l-6 6 M124 192 l6 6" stroke="#F5A623" stroke-width="4" stroke-linecap="round" fill="none" />
          </g>

          <!-- Casco de mantenimiento -->
          <g class="owl-hardhat">
            <path d="M76 62 a34 26 0 0 1 68 0 z" fill="#F5A623" />
            <rect x="72" y="60" width="76" height="8" rx="4" fill="#0B1F4D" />
            <rect x="106" y="30" width="8" height="10" rx="2" fill="#F5A623" />
          </g>

        </svg>
      </div>

      <p class="brand">Academia Impulso Digital</p>
      <h1 class="title">Estamos en mantenimiento</h1>
      <p class="subtitle">Estamos realizando algunos ajustes y nuestro sitio web no está disponible temporalmente</p>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
